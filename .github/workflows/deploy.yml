name: Deploy game

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'public/**'
      - 'server.ts'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

# Set these as GitHub repo Variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_ACCOUNT_ID  — 12-digit account ID   (terraform output aws_account_id)
#   API_URL         — CloudFront game URL    (terraform output game_url)
env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: bang-app
  EC2_TAG_NAME: bang-prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/bang-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger EC2 redeploy via SSM
        id: ssm
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # set -e so a failed pull aborts (instead of the final up -d masking it
          # with the stale local :latest). Prune old images before AND after so the
          # small EC2 disk never fills up and silently blocks future pulls.
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=${EC2_TAG_NAME}" \
            --parameters 'commands=[
              "set -e",
              "docker image prune -af || true",
              "aws ecr get-login-password --region '"${AWS_REGION}"' | docker login --username AWS --password-stdin '"${ECR_REGISTRY}"'",
              "cd /opt/bang && docker compose -f docker-compose.prod.yml --env-file .env pull",
              "cd /opt/bang && docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate app caddy",
              "docker image prune -af || true"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> $GITHUB_OUTPUT
          echo "Sent command: $CMD_ID"

      - name: Wait for SSM command to complete
        run: |
          CMD_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${EC2_TAG_NAME}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "[$i] $STATUS"
            case "$STATUS" in
              Success)  exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out"; exit 1

      - name: Smoke test /health
        if: ${{ vars.API_URL != '' }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --connect-timeout 5 --max-time 10 "${{ vars.API_URL }}/health"; then
              echo " — OK"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"; exit 1
